name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # 代码检查和测试
  check:
    name: Check and Test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码 / Checkout code
        uses: actions/checkout@v4

      - name: 安装 Rust / Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 安装系统依赖 / Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libdbus-1-dev libglib2.0-dev \
            libgtk-3-dev libatk1.0-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf2.0-dev

      - name: 缓存 Cargo / Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: 代码格式检查 / Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy 检查 / Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 运行测试 / Run tests
        run: cargo test --all-features

  # 构建多平台二进制文件
  build:
    name: Build - ${{ matrix.platform.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x86_64 (MSVC)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: auto-x-account.exe
            asset_name: auto-x-account-windows-x86_64-msvc
            
          - name: Windows x86_64 (GNU)
            os: windows-latest
            target: x86_64-pc-windows-gnu
            artifact_name: auto-x-account.exe
            asset_name: auto-x-account-windows-x86_64-gnu
            
          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: auto-x-account.exe
            asset_name: auto-x-account-windows-arm64
            
          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: auto-x-account
            asset_name: auto-x-account-macos-x86_64
            
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: auto-x-account
            asset_name: auto-x-account-macos-arm64
            
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: auto-x-account
            asset_name: auto-x-account-linux-x86_64
            
          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: auto-x-account
            asset_name: auto-x-account-linux-arm64

    runs-on: ${{ matrix.platform.os }}
    
    steps:
      - name: 检出代码 / Checkout code
        uses: actions/checkout@v4

      - name: 安装 Rust / Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: 安装 MinGW-w64 工具链 (Windows GNU) / Install MinGW-w64 toolchain (Windows GNU)
        if: runner.os == 'Windows' && matrix.platform.target == 'x86_64-pc-windows-gnu'
        run: |
          choco install mingw -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" >> $GITHUB_PATH

      - name: 安装依赖 (Linux) / Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf2.0-dev
          
      - name: 安装 ARM64 交叉编译工具 (Linux) / Install ARM64 cross-compilation tools (Linux)
        if: runner.os == 'Linux' && matrix.platform.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            crossbuild-essential-arm64
          # 安装 ARM64 的开发库
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev:arm64 \
            libdbus-1-dev:arm64 \
            libglib2.0-dev:arm64 \
            libgtk-3-dev:arm64

      - name: 缓存 Cargo / Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.platform.os }}-${{ matrix.platform.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: 构建发布版本 / Build release
        run: cargo build --release --target ${{ matrix.platform.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_SYSROOT_DIR_aarch64_unknown_linux_gnu: /usr/aarch64-linux-gnu
          PKG_CONFIG_PATH_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig

      - name: 打包二进制文件 / Package binary
        shell: bash
        run: |
          cd target/${{ matrix.platform.target }}/release
          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a ../../../${{ matrix.platform.asset_name }}.zip ${{ matrix.platform.artifact_name }}
          else
            tar czf ../../../${{ matrix.platform.asset_name }}.tar.gz ${{ matrix.platform.artifact_name }}
          fi

      - name: 上传构建产物 / Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.platform.asset_name }}
          path: |
            ${{ matrix.platform.asset_name }}.zip
            ${{ matrix.platform.asset_name }}.tar.gz

  # 创建 GitHub Release
  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: 检出代码 / Checkout code
        uses: actions/checkout@v4

      - name: 下载所有构建产物 / Download all artifacts
        uses: actions/download-artifact@v3

      - name: 创建 Release / Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## X 账号自动注册系统 ${{ github.ref_name }}
            
            ### ✨ 功能特性 / Features
            - 🤖 自动化 X (Twitter) 账号注册
            - 📧 SMTP 邮箱验证码自动提取和填写
            - 🌐 支持代理配置（HTTP/HTTPS/SOCKS5）
            - 🎨 现代化中国风 GUI 界面
            - 📦 批量注册支持
            - 🌍 多语言支持（中文/英文）
            
            ### 📥 下载 / Downloads
            
            #### Windows
            - **x86_64 (MSVC)** - 推荐，兼容性最好: `auto-x-account-windows-x86_64-msvc.zip`
            - **x86_64 (GNU)** - 静态链接，无需 MSVC 运行时: `auto-x-account-windows-x86_64-gnu.zip`
            - **ARM64** (ARM处理器): `auto-x-account-windows-arm64.zip`
            
            **版本说明：**
            - MSVC 版本：使用 Visual Studio 工具链编译，兼容性最好，推荐大多数用户使用
            - GNU 版本：使用 MinGW-w64 编译，完全静态链接，无需安装 Visual C++ 运行时库，适合追求独立部署的用户
            
            #### macOS
            - **Intel** (x86_64): `auto-x-account-macos-x86_64.tar.gz`
            - **Apple Silicon** (M1/M2/M3/M4): `auto-x-account-macos-arm64.tar.gz`
            
            #### Linux
            - **x86_64** (64位Intel/AMD): `auto-x-account-linux-x86_64.tar.gz`
            - **ARM64/aarch64** (ARM处理器): `auto-x-account-linux-arm64.tar.gz`
            
            ### 🚀 使用方法 / Usage
            
            #### GUI 模式
            ```bash
            # 直接双击运行，或使用命令行
            ./auto-x-account
            ```
            
            #### 命令行模式
            ```bash
            # 注册单个账号
            ./auto-x-account register --email your@email.com
            
            # 批量注册 10 个账号，并发数 3
            ./auto-x-account batch --count 10 --concurrent 3
            
            # 创建临时邮箱
            ./auto-x-account create-emails --count 5 --output emails.json
            
            # 使用配置文件
            ./auto-x-account --config config.json
            ```
            
            ### 📝 配置说明 / Configuration
            
            首次运行会自动生成 `config.example.json` 配置文件示例。
            
            ### 🔧 系统要求 / System Requirements
            
            - **Windows**: Windows 10/11 (x64 或 ARM64)
            - **macOS**: macOS 10.15+ (Intel 或 Apple Silicon)
            - **Linux**: Ubuntu 20.04+, Debian 11+, 或其他现代发行版
            
            ### 📖 详细文档
            
            请查看项目 [README.md](https://github.com/longzheng268/auto-x-account) 获取更多信息。
            
          files: |
            auto-x-account-windows-x86_64-msvc/*.zip
            auto-x-account-windows-x86_64-gnu/*.zip
            auto-x-account-windows-arm64/*.zip
            auto-x-account-macos-x86_64/*.tar.gz
            auto-x-account-macos-arm64/*.tar.gz
            auto-x-account-linux-x86_64/*.tar.gz
            auto-x-account-linux-arm64/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
