[package]
name = "auto-x-account"
version = "0.1.0"
edition = "2021"
authors = ["PA733 (Developer & Business)", "longzheng268", "Auto X Account Team"]
description = "专有商业软件 - 自动化 X (Twitter) 账号注册系统 (Proprietary Commercial Software)"
license = "Proprietary"
readme = "README.md"
homepage = "https://github.com/longzheng268/auto-x-account"
repository = "https://github.com/longzheng268/auto-x-account"
keywords = ["proprietary", "commercial", "twitter", "automation"]
categories = ["command-line-utilities"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(font_misans)'] }

[dependencies]
tokio = { version = "1.35", features = ["full"] }
chromiumoxide = { version = "0.6", features = ["tokio-runtime"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", features = ["json", "socks"] }
fake = { version = "2.9", features = ["derive", "chrono"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
dotenv = "0.15"
regex = "1.10"
md5 = "0.7"

# GUI dependencies
eframe = { version = "0.25", features = ["default"] }
egui = "0.25"
egui_extras = { version = "0.25", features = ["image"] }
rfd = "0.13"
image = "0.24"

# Windows 平台依赖 - 修复 winapi 功能特性缺失问题
# 显式启用 winapi 的所有必要功能，确保 eframe 能正确编译
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",      # 用户界面功能
    "windef",       # Windows 基本定义
    "wingdi",       # 图形设备接口
    "winbase",      # Windows 基础 API
    "windowsx",     # Windows 扩展宏
    "shellapi",     # Shell API
    "libloaderapi", # 库加载 API
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.bundle]
name = "X账号自动注册系统"
identifier = "com.autoxaccount.app"
icon = ["assets/icon.png"]
version = "0.1.0"
resources = ["assets/*", "fonts/*"]
copyright = "Copyright (c) 2024"
category = "Utility"
short_description = "自动化 X 账号注册工具"
long_description = "使用浏览器自动化和 SMTP 邮箱验证自动注册 X (Twitter) 账号"
